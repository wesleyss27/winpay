        <style>
            @import url("https://fonts.googleapis.com/css2?family=Anton&family=Great+Vibes&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=REM:wght@900&display=swap");

            .corpo {
                height: 707px;
                width: 1000px;
                border: 1px solid #666;
                text-align: center;
                background: url("themes/imgs/background-certificado.jpg") no-repeat;
                background-size: cover;
                /* display: flex;
                align-items: center; */
            }

            .titulo {
                text-align: center;
                font-size: 80px;
                font-family: "REM";

                color: #1D465F;
            }

            .subtitulo {
                text-align: center;
                font-family: "Great Vibes";
                font-size: 40px;
                margin-top: -80px;
                letter-spacing: 4px;
            }

            .descricao {
                font-size: 30px;
                font-family: Poppins;
            }

            .destaque {
                font-size: 40px;
                font-weight: 600;
            }

    <body>
        <div class="corpo">
            <h1 class="titulo">CERTIFICADO</h1>

                Certificamos que <br>

            <p class="descricao">21/08/2023</p>
