version: "3"
services:

  php-apache:
    image: misaelsilva777/php-apache-redrocket:1.0
    container_name: php-apache-club
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./php:/usr/local/etc/php
      - ./.htpasswd:/etc/apache2/.htpasswd
      - ./000-default.conf:/etc/apache2/sites-available/000-default.conf
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
