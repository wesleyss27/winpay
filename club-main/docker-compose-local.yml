version: "3"
services:

  php-apache:
    image: misaelsilva777/php-apache-redrocket:1.0
    container_name: php-apache-club
    volumes:
      - ./:/var/www/html
      - ./php:/usr/local/etc/php
    networks:
      - mynetwork
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.club.rule=Host(`club.winpay.digital`)"
      - "traefik.http.services.php-apache-club.loadbalancer.server.port=80"
      - "traefik.http.routers.club.tls.certresolver=myresolver"

networks:
  mynetwork:
    driver: bridge
