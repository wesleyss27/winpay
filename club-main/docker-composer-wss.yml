version: "3"
services:

  php-apache:
    image: misaelsilva777/php-apache-redrocket:1.0
    container_name: php-apache-club
    volumes:
      - ./:/var/www/html
      - ./php:/usr/local/etc/php
    ports:
      - "8182:80"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
