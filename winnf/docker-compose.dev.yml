services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: winnf-backend
    # porta 5000 só acessível internamente — o ng serve proxy repassa
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
      - DATABASE_URL=sqlite:////app/winnf.db
      - JWT_SECRET_KEY=winnf-secret-dev
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: winnf-frontend
    working_dir: /app
    ports:
      - "4200:4200"   # único ponto de entrada
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm install --legacy-peer-deps && npx ng serve --host 0.0.0.0 --port 4200 --poll 500 --proxy-config proxy.conf.json"
    depends_on:
      - backend
    restart: unless-stopped
