<div class="page-container">
  <div class="page-header">
    <h2 class="page-title">Clientes</h2>
    <button mat-raised-button color="primary" (click)="openDialog()">
      <mat-icon>person_add</mat-icon>
      Novo Cliente
    </button>
  </div>

  <mat-card class="search-card">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar por nome ou CPF/CNPJ</mat-label>
      <input matInput (input)="onSearch($event)" placeholder="Digite para buscar..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </mat-card>

  <mat-card class="table-card">
    <div class="loading-wrapper" *ngIf="isLoading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div class="table-wrapper" *ngIf="!isLoading">
      <table mat-table [dataSource]="clientes" class="data-table">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let row">{{ row.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="cpf_cnpj">
          <th mat-header-cell *matHeaderCellDef>CPF/CNPJ</th>
          <td mat-cell *matCellDef="let row">{{ row.cpf_cnpj }}</td>
        </ng-container>

        <ng-container matColumnDef="cidade_uf">
          <th mat-header-cell *matHeaderCellDef>Cidade/UF</th>
          <td mat-cell *matCellDef="let row">
            {{ row.cidade && row.uf ? row.cidade + '/' + row.uf : (row.cidade || row.uf || '-') }}
          </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>E-mail</th>
          <td mat-cell *matCellDef="let row">{{ row.email || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button color="primary" (click)="openDialog(row)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteCliente(row)" matTooltip="Remover">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="table-row"></tr>
      </table>

      <div class="empty-state" *ngIf="clientes.length === 0">
        <mat-icon>contacts</mat-icon>
        <p>Nenhum cliente encontrado.</p>
      </div>
    </div>
  </mat-card>
</div>
