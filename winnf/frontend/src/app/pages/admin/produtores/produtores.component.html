<div class="page-container">
  <div class="page-header">
    <h2 class="page-title">Produtores</h2>
    <button mat-raised-button color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon>
      Novo Produtor
    </button>
  </div>

  <mat-card class="table-card">
    <div class="loading-wrapper" *ngIf="isLoading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div class="table-wrapper" *ngIf="!isLoading">
      <table mat-table [dataSource]="produtores" class="data-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let row">{{ row.name }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>E-mail</th>
          <td mat-cell *matCellDef="let row">{{ row.email }}</td>
        </ng-container>

        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <span class="status-chip" [class.active]="row.active" [class.inactive]="!row.active">
              {{ row.active ? 'Ativo' : 'Inativo' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="created_at">
          <th mat-header-cell *matHeaderCellDef>Cadastro</th>
          <td mat-cell *matCellDef="let row">{{ row.created_at | date: 'dd/MM/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button color="primary" (click)="openDialog(row)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              [color]="row.active ? 'warn' : 'primary'"
              (click)="toggleAtivo(row)"
              [matTooltip]="row.active ? 'Desativar' : 'Ativar'"
            >
              <mat-icon>{{ row.active ? 'block' : 'check_circle' }}</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="table-row"></tr>
      </table>

      <div class="empty-state" *ngIf="produtores.length === 0">
        <mat-icon>business</mat-icon>
        <p>Nenhum produtor encontrado.</p>
      </div>

      <mat-paginator
        [length]="totalItems"
        [pageSize]="pageSize"
        [pageSizeOptions]="[10, 20, 50]"
        (page)="onPageChange($event)"
        *ngIf="totalItems > 0"
      ></mat-paginator>
    </div>
  </mat-card>
</div>
