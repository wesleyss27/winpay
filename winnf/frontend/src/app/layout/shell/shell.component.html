<mat-sidenav-container class="shell-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    class="shell-sidenav"
  >
    <div class="sidenav-header">
      <div class="logo-area">
        <mat-icon class="logo-icon">receipt</mat-icon>
        <span class="logo-text">WinNF</span>
      </div>
      <div class="user-info">
        <div class="user-name">{{ currentUser?.name }}</div>
        <span class="role-badge role-{{ role }}">{{ roleLabel }}</span>
      </div>
    </div>

    <mat-nav-list class="nav-list">
      <a
        mat-list-item
        *ngFor="let link of navLinks"
        [routerLink]="link.path"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav-item"
        (click)="onNavClick()"
      >
        <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
        <span matListItemTitle>{{ link.label }}</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <button mat-button class="logout-btn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Sair
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar class="top-toolbar">
      <button mat-icon-button class="menu-btn" *ngIf="isMobile" (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Win<span>NF</span></span>
      <span class="spacer"></span>
      <span class="toolbar-user">{{ currentUser?.name }}</span>
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          Sair
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
