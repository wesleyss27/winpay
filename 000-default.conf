<VirtualHost *:80>
    ServerAdmin admin@redrocketpay.com.br
    ServerName app.redrocketpay.com
    DocumentRoot /var/www/html
</VirtualHost>

<VirtualHost *:443>
    ServerName app.redrocketpay.com

    # Configurações do certificado SSL
    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/seu_certificado.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/sua_chave.key

</VirtualHost>

