<VirtualHost *:80>
    ServerName turb.winpay.digital
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/winturb_error.log
    CustomLog ${APACHE_LOG_DIR}/winturb_access.log combined
</VirtualHost>
