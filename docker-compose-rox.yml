version: "3"
services:
  php-apache:
    image: misaelsilva777/php-apache-redrocket:1.0
    container_name: php-apache
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - ./php:/usr/local/etc/php
      - ./.htpasswd:/etc/apache2/.htpasswd
      - ./000-default-alefy.conf:/etc/apache2/sites-available/000-default-alefy.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - mynetwork
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.winpay.digital`)"
      - "traefik.http.services.php-apache.loadbalancer.server.port=80"
      - "traefik.http.routers.app.tls.certresolver=myresolver"

  mysql:
    container_name: mariadb-roxpay
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: 0
    ports:
      - "3309:3306"
    networks:
      - mynetwork

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: "phpmyadmin"
    ports:
      - 8181:80
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root
    links:
      - mysql
    restart: always
    networks:
      - mynetwork
  
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done;'"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
