<VirtualHost *:80>
    ServerAdmin admin@redrocketpay.com.br
    ServerName app.winpay.digital
    ServerAlias app.winpay.digital
    DocumentRoot /var/www/html
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/

    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        ForceType text/plain
        RedirectMatch 404 "^(?!/\.well-known/acme-challenge/[\w-]{43}$)"
    </Directory>

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^/(.*) https://%{SERVER_NAME}/$1 [R,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName app.winpay.digital
    ServerAlias app.winpay.digital

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/winpay.digital/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/winpay.digital/privkey.pem

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerAdmin admin@redrocketpay.com.br
    ServerName app.redrocketpay.com.br
    DocumentRoot /var/www/html
</VirtualHost>

<VirtualHost *:80>
    ServerAdmin admin@redrocketpay.com.br
    ServerName localhost
    DocumentRoot /var/www/html
</VirtualHost>